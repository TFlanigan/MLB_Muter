; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ============================================================
; FIRMWARE x BOARD SELECTION
; ============================================================
; Six environments = three firmwares × two boards. Pick one in the PlatformIO
; sidebar, or with -e on the CLI.
;
;   Boards:
;     (no suffix)  AI-Thinker ESP32-CAM     (plain ESP32, Xtensa LX6)
;     _s3 suffix   Freenove ESP32-S3-WROOM  (ESP32-S3, Xtensa LX7 + SIMD)
;
;   Firmwares:
;     MLB_Muter        commercial detection + IR mute
;     data_collection  upload labeled frames to Edge Impulse
;     camera_stream    live MJPEG to iPhone Safari (alignment check)
;
;   e.g.  pio run -e MLB_Muter_s3 --target upload
; ============================================================

[platformio]
; "Default" tasks / bare `pio run` target this env only.
default_envs = MLB_Muter_s3

; ---- settings shared by every environment ----
[env]
; Using pioarduino's fork of platform-espressif32 instead of the official one.
; The official platform ships GCC 8.4 + binutils 2.35 (both from 2020); the
; pioarduino fork bundles GCC 14+ matched to the newer arduino-esp32 v3.x.
; To revert to the official platform (e.g. if a build breaks): change the line
; below to:
;   platform = espressif32
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
framework = arduino
monitor_speed = 115200

; ============================================================
; BOARD BASE CONFIGS
; ============================================================
[board_esp32cam]
board = esp32cam
; Plain ESP32 (Xtensa LX6) has no SIMD. Espressif's ESP-NN int8 kernels
; miscompute on this core for our MobileNet (model always returns "commercial"),
; so fall back to TFLite's reference C kernels — correct but ~4 sec/frame.
build_flags = -DEI_CLASSIFIER_TFLITE_ENABLE_ESP_NN=0

[board_freenove_s3]
board = esp32-s3-devkitc-1
; Freenove FNK0085 = ESP32-S3-WROOM-1 N8R8 (8MB QIO flash + 8MB OPI PSRAM).
board_upload.flash_size = 8MB
board_build.flash_size = 8MB
board_build.arduino.memory_type = qio_opi
; BOARD_FREENOVE_S3 selects the S3 pin map in camera_pins.h.
; BOARD_HAS_PSRAM enables PSRAM for the Arduino core / camera frame buffers.
; ARDUINO_USB_CDC_ON_BOOT=0 routes Serial to UART0 (the CH343 "USB-UART" port).
; Set this to 1 instead if you monitor via the board's native "USB" port.
; ESP-NN disabled on BOTH boards (plain ESP32 and S3). Conclusive testing
; showed Espressif's ESP-NN int8 kernels miscompute our MobileNet — the model
; always outputs "commercial" regardless of input. This is true for both the
; LX6 reference kernels (plain ESP32) AND the LX7 SIMD kernels (S3), so it's
; an ESP-NN integration bug, not a SIMD-assembly issue. Falling back to
; TFLite's pure C reference kernels is correct (matches Studio) but ~3 sec
; per inference on S3 (vs ~4 sec on plain ESP32). If EI/Espressif fix the
; ESP-NN bug upstream, set this back to 1 and add the _S3=1 and overflow/
; scratch buffer count overrides — see git history for the full config.
build_flags =
  -DBOARD_FREENOVE_S3
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DEI_CLASSIFIER_TFLITE_ENABLE_ESP_NN=0
;
; --- ESP-NN re-enable reference (DO NOT add inline above; -D flags in a
; multi-line value cannot use ; for inline comments). To retry ESP-NN if EI
; or Espressif fix the int8 correctness bug, change ESP_NN=0 above to =1 and
; also append the lines below:
;
;   -DEI_CLASSIFIER_TFLITE_ENABLE_ESP_NN_S3=1   (required for .S files —
;                                                 auto-define gate via
;                                                 CONFIG_IDF_TARGET_ESP32S3
;                                                 only fires for C/C++)
;   -DEI_MAX_OVERFLOW_BUFFER_COUNT=500          (model has more ops than the
;                                                 SDK default 30/S3 limit)
;   -DEI_MAX_SCRATCH_BUFFER_COUNT=500
;
; Also requires the local patch at
; src/edge-impulse-sdk/porting/ei_classifier_porting.h (#ifndef guard around
; the S3 EI_MAX_OVERFLOW_BUFFER_COUNT redefine) — already applied, but will
; be wiped if the edge-impulse-sdk/ directory is replaced by a new Studio
; deployment. Re-apply after any redeployment.

; ============================================================
; FIRMWARE BASE CONFIGS
; ============================================================
[fw_muter]
; Commercial detection + IR mute (main.cpp + full Edge Impulse SDK).
; Compile only the espressif porting layer — the others cause
; EI_PORTING_ARDUINO redefinition / multiple-definition link errors.
build_src_filter =
  +<*>
  -<data_collection.cpp>
  -<camera_stream.cpp>
  -<edge-impulse-sdk/porting/ambiq/>
  -<edge-impulse-sdk/porting/android/>
  -<edge-impulse-sdk/porting/arduino/>
  -<edge-impulse-sdk/porting/brickml/>
  -<edge-impulse-sdk/porting/ceva-npn/>
  -<edge-impulse-sdk/porting/clib/>
  -<edge-impulse-sdk/porting/ethos-core-driver/>
  -<edge-impulse-sdk/porting/himax/>
  -<edge-impulse-sdk/porting/himax-we2/>
  -<edge-impulse-sdk/porting/iar/>
  -<edge-impulse-sdk/porting/infineon-psoc62/>
  -<edge-impulse-sdk/porting/mbed/>
  -<edge-impulse-sdk/porting/mingw32/>
  -<edge-impulse-sdk/porting/nordic-axon/>
  -<edge-impulse-sdk/porting/particle/>
  -<edge-impulse-sdk/porting/posix/>
  -<edge-impulse-sdk/porting/raspberry/>
  -<edge-impulse-sdk/porting/renesas-ra/>
  -<edge-impulse-sdk/porting/seeed-vision-ai/>
  -<edge-impulse-sdk/porting/silabs/>
  -<edge-impulse-sdk/porting/sony/>
  -<edge-impulse-sdk/porting/stm32-cubeai/>
  -<edge-impulse-sdk/porting/synaptics/>
  -<edge-impulse-sdk/porting/ti/>
  -<edge-impulse-sdk/porting/zephyr/>
lib_deps =
  IRremoteESP8266
  bblanchon/ArduinoJson@^6.21.0
board_build.embed_files =
  Test_Images/program-01.jpg
  Test_Images/program-02.jpg
  Test_Images/program-03.jpg
  Test_Images/program-04.jpg
  Test_Images/program-05.jpg
  Test_Images/commercial-01.jpg
  Test_Images/commercial-02.jpg
  Test_Images/commercial-03.jpg
  Test_Images/commercial-04.jpg
  Test_Images/commercial-05.jpg

[fw_data_collection]
; Upload labeled frames to Edge Impulse (data_collection.cpp only — no EI SDK).
build_src_filter =
  -<*>
  +<data_collection.cpp>
lib_deps =
  bblanchon/ArduinoJson@^6.21.0
  crankyoldgit/IRremoteESP8266 @ ^2.8.6

[fw_camera_stream]
; Live MJPEG stream for alignment (camera_stream.cpp only — no EI SDK, no IR).
build_src_filter =
  -<*>
  +<camera_stream.cpp>

; ============================================================
; ENVIRONMENTS  (board x firmware)
; ============================================================
[env:MLB_Muter]
extends = board_esp32cam, fw_muter

[env:MLB_Muter_s3]
extends = board_freenove_s3, fw_muter

[env:data_collection]
extends = board_esp32cam, fw_data_collection

[env:data_collection_s3]
extends = board_freenove_s3, fw_data_collection

[env:camera_stream]
extends = board_esp32cam, fw_camera_stream

[env:camera_stream_s3]
extends = board_freenove_s3, fw_camera_stream
